<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Gabarit de pub motion design</title>
<!--
  Gabarit de départ · DKM Learning Hub · La pub en dix minutes
  https://dkm-learning-hub.vercel.app/resources/pub-motion

  Trois scènes, quinze secondes, une fonction render(t).
  Ouvre ce fichier dans Chrome, ouvre la console, et tape :
      render(0)    render(5)    render(14)
  Tu vois l'instant demandé. Il n'y a pas de lecture automatique,
  et c'est voulu : render.py appelle render() image par image.

  Les polices : ce gabarit utilise les polices du système pour
  marcher tout de suite, partout. Quand tu mets les tiennes, dépose
  les fichiers dans un dossier fonts/ et déclare-les en @font-face
  ci-dessous. C'est à ce moment que la ligne document.fonts.ready
  de render.py devient indispensable.
-->
<style>
/* @font-face{font-family:Titre;src:url(fonts/TaPolice-Bold.ttf);font-weight:700} */

:root{
  /* La charte. Une seule déclaration : change une valeur ici, elle change dans les trois scènes. */
  --accent:#C8553D;
  --bg:#2A1A12;
  --ink:#F4E59A;

  --font-title:'DM Serif Display',Georgia,serif;
  --font-body:system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden}
#stage{
  position:relative;width:1080px;height:1920px;overflow:hidden;
  background:radial-gradient(ellipse 70% 45% at 50% 40%,#3a271c 0%,var(--bg) 62%,var(--bg) 100%);
  font-family:var(--font-body);color:var(--ink);
}
.scene{position:absolute;inset:0;opacity:0}
.mid{position:absolute;left:90px;right:90px;top:50%;transform:translateY(-50%);text-align:center}
.kicker{font-family:var(--font-body);font-weight:700;font-size:34px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.title{font-family:var(--font-title);font-size:104px;line-height:1.02;margin-top:34px}
.sub{font-size:44px;line-height:1.35;margin-top:34px;opacity:.78}
.cta{
  display:inline-block;margin-top:56px;padding:30px 62px;border-radius:999px;
  background:var(--accent);color:#fff;font-weight:800;font-size:44px;letter-spacing:.02em;
}
.bar{position:absolute;left:90px;right:90px;bottom:220px;height:6px;border-radius:999px;background:rgba(244,229,154,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
/* Zones interdites sur un Reel : environ 250 px en haut, 400 px en bas.
   Rien d'important ne doit y vivre. Décommente pour les visualiser. */
/* #stage::before{content:"";position:absolute;left:0;right:0;top:0;height:250px;background:rgba(200,85,61,.25)}
   #stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:400px;background:rgba(200,85,61,.25)} */
</style>
</head>
<body>
<div id="stage">

  <!-- S1 · accroche -->
  <div class="scene" id="s1">
    <div class="mid">
      <div class="kicker">Le problème</div>
      <div class="title" id="s1title">Ta phrase d’accroche ici.</div>
    </div>
  </div>

  <!-- S2 · preuve -->
  <div class="scene" id="s2">
    <div class="mid">
      <div class="kicker">La preuve</div>
      <div class="title">Ce que ton produit fait.</div>
      <div class="sub">Une phrase concrète. Pas un adjectif.</div>
    </div>
    <div class="bar"><i id="s2bar"></i></div>
  </div>

  <!-- S3 · appel -->
  <div class="scene" id="s3">
    <div class="mid">
      <div class="kicker">Maintenant</div>
      <div class="title">Une seule action.</div>
      <div class="cta" id="s3cta">Clique ici</div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   Le tableau des scènes. Toute la structure de la pub tient ici :
   une ligne par scène, sa seconde de début, sa seconde de fin.
   ============================================================ */
const S = [
  { el: 's1', start:  0, end:  3 },
  { el: 's2', start:  3, end: 11 },
  { el: 's3', start: 11, end: 15 },
];

const DURATION = 15;

/* Longueur du fondu enchaîné, en secondes. */
const FADE = 0.4;

/* Progression de 0 à 1 entre a et b, bornée. Déterministe. */
function at(t, a, b) {
  if (b <= a) return 0;
  return Math.min(1, Math.max(0, (t - a) / (b - a)));
}

/* Adoucissement. Pas d'animation CSS qui joue toute seule : tout
   est calculé à partir de t, sinon deux rendus donnent deux vidéos. */
function ease(p) {
  return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
}

const $ = (id) => document.getElementById(id);

/* ============================================================
   render(t) dessine l'instant t, en secondes. C'est la seule
   fonction que render.py appelle. Elle doit être déterministe :
   même t, même image, toujours.
   ============================================================ */
function render(t) {
  // 1. Quelle scène est à l'écran, et avec quel fondu
  //
  // Fondu enchaîné, pas fondu au noir : la scène entrante arrive PAR DESSUS la
  // sortante, qui reste opaque en dessous. Elle commence donc FADE secondes
  // avant l'heure. Sans ça, il y a une image entièrement noire à chaque
  // transition, et ça se voit.
  //
  // Aux deux bouts, aucun fondu. La première image sert de vignette dans le
  // fil : si elle part du noir, c'est elle qu'on voit. La dernière porte
  // l'appel à l'action : si elle s'efface, personne ne le lit.
  S.forEach((s, i) => {
    const el = $(s.el);
    const from = i === 0 ? s.start : s.start - FADE;
    const inside = t >= from && t < s.end;
    const fadeIn = i === 0 ? 1 : at(t, from, s.start);
    el.style.opacity = inside ? String(fadeIn) : '0';
    // léger mouvement vers le haut à l'arrivée de la scène
    const rise = inside ? (1 - ease(at(t, from, from + 0.8))) * 40 : 40;
    el.style.transform = `translateY(${rise}px)`;
  });

  // 2. Les détails propres à chaque scène
  $('s2bar').style.width = `${ease(at(t, 3.6, 10.4)) * 100}%`;

  const pulse = ease(at(t, 11.4, 12.2));
  $('s3cta').style.transform = `scale(${0.88 + pulse * 0.12})`;
}

// État de départ quand on ouvre la page à la main
render(0);
window.render = render;
window.DURATION = DURATION;
</script>
</body>
</html>
